[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64 && apt-get update && apt-get install -y libssl-dev libssl-dev:arm64 pkg-config"
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "SQLX_OFFLINE",
    "PKG_CONFIG_ALLOW_CROSS",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR",
    "X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR",
    "AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_DIR",
]
